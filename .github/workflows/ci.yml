name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.os }} / shared=${{ matrix.shared }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        shared: ['OFF', 'ON']
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >-
          cmake -S . -B build/ci -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON -DBUILD_SHARED_LIBS=${{ matrix.shared }}
      - name: Build
        run: cmake --build build/ci --config Release --parallel
      - name: Test library, CLI and relocated C/C++ package
        run: ctest --test-dir build/ci -C Release --output-on-failure
      - name: Package
        working-directory: build/ci
        run: cpack -C Release
      - name: Upload release package
        if: github.event_name == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: libvnascpi-${{ matrix.os }}-shared-${{ matrix.shared }}
          path: |
            build/ci/libvnascpi-*.zip
            build/ci/libvnascpi-*.tar.gz
          if-no-files-found: error

  library-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure without CLI
        run: cmake -S . -B build/library-only -DBUILD_TESTING=ON -DLIBVNASCPI_BUILD_CLI=OFF
      - name: Build and test
        run: |
          cmake --build build/library-only --parallel
          ctest --test-dir build/library-only --output-on-failure

  docs-and-release-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-docs.txt
      - run: python -m mkdocs build --strict
      - run: bash tests/test_release.sh

  publish-release:
    if: github.event_name == 'release'
    needs: [build-and-test, library-only, docs-and-release-script]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: libvnascpi-*
          path: release-assets
      - name: Give static and shared packages distinct names
        shell: bash
        run: |
          mkdir upload
          for directory in release-assets/*; do
            for package in "$directory"/*; do
              cp "$package" "upload/$(basename "$directory")-$(basename "$package")"
            done
          done
      - uses: softprops/action-gh-release@v2
        with:
          files: upload/*
          fail_on_unmatched_files: true
